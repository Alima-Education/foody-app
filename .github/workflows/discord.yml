name: Discord Notification

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord Notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          PAYLOAD=$(jq -n \
            --arg repo "$REPOSITORY" \
            --arg commit "$COMMIT" \
            --arg actor "$ACTOR" \
            '{
              content: ("🚀 Update GitHub berhasil!\nRepository: " + $repo + "\nPengirim: " + $actor + "\nCommit: " + $commit)
            }')

          curl -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK" \
            --fail-with-body