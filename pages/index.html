<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self' https://www.gstatic.com https://www.google.com;
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://www.gstatic.com;
  font-src https://fonts.gstatic.com;
  img-src 'self' data: https://www.gstatic.com https://www.google.com;
  connect-src 'self' https://*.googleapis.com https://smtp.abiyyucakra.my.id https://foody-notify.foody-app.workers.dev http://localhost:8787;
  frame-src https://www.google.com https://recaptcha.google.com;
  object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FOODY APP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tailwind.css">
</head>
<body class="bg-ivory text-ink font-sans relative">

<div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
  <div class="absolute -top-24 -left-20 w-80 h-80 rounded-full bg-chili/25 blur-[100px]"></div>
  <div class="absolute -bottom-24 -right-16 w-96 h-96 rounded-full bg-herb/20 blur-[110px]"></div>
</div>

<header class="sticky top-0 z-20 bg-ivory/85 backdrop-blur-md border-b border-line">
  <div class="flex items-center justify-between px-4 pt-3 pb-2 max-w-2xl mx-auto">
    <div>
      <h1 class="font-serif text-xl text-chili leading-none">FOODY APP</h1>
      <span class="text-[16px] text-inksoft">Lunch & dessert harian</span>
    </div>
    <div class="flex items-center gap-2">
      <button data-action="openHistory" class="flex items-center gap-1.5 bg-surface text-ink border border-line text-sm font-semibold rounded-full px-4 py-2.5">Riwayat</button>
      <button data-action="openCart" class="relative flex items-center gap-1.5 bg-surface text-ink border border-line text-sm font-semibold rounded-full px-4 py-2.5">
        Keranjang
        <span id="cartCount" class="bg-chili text-white rounded-full text-xs px-2 py-0.5">0</span>
      </button>
    </div>
  </div>

  <div id="accountBar" class="hidden px-4 pb-2 max-w-2xl mx-auto">
    <div class="flex items-center justify-between gap-3 rounded-full border border-line bg-card px-4 py-1.5">
      <span id="accountText" class="text-xs text-inksoft truncate"></span>
      <button data-action="logout" class="flex-none text-xs font-semibold text-chilidark">Keluar</button>
    </div>
  </div>

  <div class="px-4 pb-3 max-w-2xl mx-auto">
    <input id="search" placeholder="Cari menu, misal: ricebowl, es teh..."
      class="w-full rounded-full border border-line bg-card text-ink placeholder:text-inksoft/70 px-4 py-2.5 text-sm outline-none focus:border-herb">
  </div>
  <div id="tabs" class="flex gap-2 px-4 pb-3 max-w-2xl mx-auto overflow-x-auto"></div>
</header>

<main class="max-w-2xl mx-auto px-4">
  <section class="pt-6 pb-3">
    <h2 class="font-serif text-3xl sm:text-4xl leading-tight max-w-xs">Makan siang enak, tanpa ribet mikir menu.</h2>
    <p class="text-inksoft text-sm mt-2 max-w-sm">Pilih menu hari ini, pesan, lalu pantau statusnya dari menu Riwayat.</p>
  </section>

  <div class="bg-herb text-[#0d2420] rounded-2xl px-5 py-4 my-4 flex items-center justify-between gap-4">
    <div>
      <h3 class="font-serif text-base">Langganan mingguan</h3>
      <p id="subDesc" class="text-sm opacity-80 mt-0.5"></p>
    </div>
    <span id="subBadge" class="flex-none rounded-full px-3 py-1 text-xs font-bold"></span>
  </div>

  <div id="menuArea"></div>
</main>

<footer class="text-center text-inksoft text-xs px-5 py-10">FOODY APP — dibuat untuk katering lunch & dessert harian.</footer>

<div id="overlay" data-action="closeCart" class="fixed inset-0 bg-black/40 z-30 opacity-0 pointer-events-none transition-opacity"></div>
<div id="drawer" class="fixed top-0 right-0 h-full w-full sm:w-[380px] bg-ivory z-40 translate-x-full transition-transform flex flex-col pt-safe">
  <div class="flex items-center justify-between px-5 py-4 border-b border-line">
    <h3 id="drawerTitle" class="font-serif text-lg">Keranjang</h3>
    <button data-action="closeCart" class="text-xl text-inksoft" aria-label="Tutup">✕</button>
  </div>
  <div id="cartBody" class="flex-1 overflow-y-auto px-5 py-3"></div>
  <div id="cartFoot" class="px-5 py-4 border-t border-line"></div>
</div>

<div id="toast" role="status" aria-live="polite"
  class="fixed left-1/2 top-4 mt-safe -translate-x-1/2 -translate-y-24 opacity-0 z-[100] w-[92%] max-w-sm pointer-events-none transition-all duration-300">
  <div id="toastInner" class="flex items-start gap-3 rounded-2xl border px-4 py-3 shadow-2xl text-sm font-semibold">
    <span id="toastIcon" class="text-base leading-none mt-0.5"></span>
    <span id="toastText"></span>
  </div>
</div>
<div id="recaptcha-container"></div>

<script type="module" src="../script/app.js"></script>
</body>
</html>
